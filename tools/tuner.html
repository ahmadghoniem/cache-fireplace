<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clawd furnace tuner</title>
<style>
  :root { --bg: #161514; --panel: #1f1e1c; --line: #34322f; --text: #e8e4dc; --dim: #8a8580; --clay: #d97757; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 15px; margin: 0; color: var(--clay); }
  #status { font-family: Consolas, monospace; color: var(--dim); }
  #keys { margin-left: auto; color: var(--dim); }
  kbd { border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-family: Consolas, monospace; }
  #stage { padding: 12px 16px; overflow-x: auto; }
  canvas { display: block; image-rendering: pixelated; }
  #strip { display: flex; flex-wrap: wrap; gap: 12px; padding: 0 16px 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; cursor: pointer; }
  .card:hover { border-color: var(--clay); }
  .card span { display: block; color: var(--dim); margin-bottom: 4px; }
  #panels { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; padding: 0 16px 24px; align-items: start; }
  fieldset { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; margin: 0; padding: 8px 10px 10px; min-width: 0; }
  legend { padding: 0 6px; font-weight: 600; display: flex; gap: 10px; align-items: center; }
  legend label { font-weight: 400; color: var(--dim); }
  fieldset.override legend label { color: var(--clay); }
  .row { display: grid; grid-template-columns: 78px 1fr 52px; gap: 8px; align-items: center; margin: 5px 0; }
  .row > span:first-child { color: var(--dim); }
  .row output { font-family: Consolas, monospace; text-align: right; color: var(--dim); }
  .choices { display: flex; flex-wrap: wrap; gap: 4px; }
  button { background: #2a2826; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 3px 9px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--dim); }
  button.on { background: var(--clay); border-color: var(--clay); color: #1a1a1a; }
  button.big { width: 100%; padding: 6px; margin-top: 4px; font-weight: 600; }
  select, input[type=text] { background: #2a2826; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; font: inherit; width: 100%; }
  input[type=range] { width: 100%; accent-color: var(--clay); }
  textarea { width: 100%; height: 190px; background: #121110; color: var(--text); border: 1px solid var(--line); border-radius: 4px; font: 12px/1.4 Consolas, monospace; resize: vertical; }
  .note { color: var(--dim); font-size: 12px; margin: 4px 0 0; }
</style>
</head>
<body>
<header>
  <h1>Clawd furnace tuner</h1>
  <span id="status"></span>
  <span id="keys"><kbd>p</kbd> send prompt &nbsp; <kbd>space</kbd> play/pause &nbsp; <kbd>.</kbd> step</span>
</header>
<section id="stage"><canvas id="term"></canvas></section>
<section id="strip"></section>
<section id="panels"></section>
<script>
(() => {
  // hooks/look.ts
  var LOOK = {
    size: 75,
    clawd: "built-in",
    furnace: "pot-belly",
    thrown: "log",
    burning: "steady",
    cold: "shiver",
    expired: "ice",
    bar: { style: "loud", width: 10, layout: "stack", title: "cache", color: "leitstand" }
  };

  // hooks/sprites.ts
  var PAL = {
    X: 14251863,
    x: 11031098,
    E: 0,
    W: 9132587,
    w: 6175258,
    o: 14268286,
    K: 3881794,

    c: 1908002,
    g: 6974072,
    p: 15657696,
    q: 10130828,
    S: 4882369,
    s: 3104150
  };
  var artWidth = (art) => Math.max(0, ...art.map((l) => l.length));
  var CLAWDS = {
    "built-in": {
      front: [
        "..XXXXXXXX..",
        "..XEXXXXEX..",
        "XXXXXXXXXXXX",

        "..X.X..X.X.."
      ],
      left: [

        "XXXXXXXXXXXX",
        "XXXXXXXXXXXX",

        "..X.X..X.X..",
        "..X.X..X.X.."
      ],
      blink: [
        "..XXXXXXXX..",
        "..XXXXXXXX..",
        "XXXXXXXXXXXX",
        "XXXXXXXXXXXX",
        "..XXXXXXXX..",
        "..XXXXXXXX..",
        "..X.X..X.X..",
        "..X.X..X.X.."
      ],
      crouch: [
        "..XXXXXXXX..",
        "..EXXXXEXX..",
        "XXXXXXXXXXXX",
        "XXXXXXXXXXXX",
        "..XXXXXXXX..",
        "..XXXXXXXX..",
        ".XX.X..X.XX."
      ],
      up: [
        "XX........XX",
        "XXXXXXXXXXXX",

        "..XXXXXXXX..",
        "..XXXXXXXX..",
        "..XXXXXXXX..",
        "..X.X..X.X..",
        "..X.X..X.X.."
      ],
      warm: [
        "..XXXXXXXX...",
        "..XXEXXXXE...",
        "..XXXXXXXXXXX",
        "..XXXXXXXXXXX",
        "..XXXXXXXX...",

        "..X.X..X.X...",

      ],
      hug: [

        "..XXXXXXXX..",
        ".XxxxxxxxxX.",
        "..XXXXXXXX..",
        "..XXXXXXXX..",
        "..X.X..X.X..",
        "..X.X..X.X.."
      ],
      sleep: [
        "..XXXXXXXX..",

        "XXXXXXXXXXXX",
        "XXXXXXXXXXXX",
        "..XXXXXXXX..",
        "..XXXXXXXX..",
        ".XX.X..X.XX."
      ]
    }
  };
  var SCARF = [
    "............",
    "............",
    "..SSSSSSSS..",
    "...s........",
    "...S........",
    "...s........"
  ];
  var FURNACES = {
    "pot-belly": {
      art: [
        ".......PP...",
        "..hhhhhPPh..",
        ".hKKKKKKKKKh",
        ".KKkDDDDkKKK",
        ".KKDDDDDDKrK",
        ".KKDDDDDDKBK",
        ".KKDDDDDDKKK",
        ".KKKKKKKKKKK",
        ".hhhhhhhhhhh",
        "..KK.....KK."
      ],
      mouth: { x: 3, y: 3, w: 6, h: 4 },
      pipe: { x: 7, w: 2 }
    },
    "box stove": {
      art: [
        "........PP..",
        "........PP..",
        ".hhhhhhhPPh.",
        ".KKKKKKKKKKK",
        ".KkDDDDDDkKK",
        ".KDDDDDDDDBK",
        ".KDDDDDDDDKK",
        ".KkkkkkkkkKK",
        ".hhhhhhhhhhh",
        ".KK......KK."
      ],
      mouth: { x: 2, y: 4, w: 8, h: 3 },
      pipe: { x: 8, w: 2 }
    }
  };
  var THROWN = {
    log: {
      held: ["WWWo", "wwwo"],
      pile: [
        "WWWo.",
        "wwwo.",
        ".WWWo",
        ".wwwo",
        "WWWo.",
        "wwwo."
      ]
    },
    coal: {
      held: ["gc", "cc"],
      pile: [
        ".cgc.",
        "cgccg",
        "KKKKK",
        "hKKKh",
        ".KKK."
      ]
    },
    page: {
      held: ["pqp", "ppp"],
      pile: [
        ".ppp.",
        "pqqqp",
        "ppppp",
        "qqqqq"
      ]
    }
  };

  // hooks/scene.ts
  var COLD_MS = 10 * 60 * 1000;
  var T_CROUCH = 300;
  var T_LIFT = 750;
  var T_IMPACT = 1150;
  var THROW_MS = 1900;
  var DEFAULT = 16777216;
  var NONE = -1;
  var ICE = 12576511;
  var SNOW = [15661055, 12180725];
  var ASH = 4867394;
  var FLAME = [5902856, 10231562, 13910031, 15759384, 16364083, 16770688];
  var TONE = { clay: 14251863, warn: 13666846, bad: 14242639, track: 9078144 };
  var CHOICES = {
    size: [75, 60],
    burning: ["steady", "plume", "warm"],
    cold: ["shiver", "scarf", "huddle"],
    expired: ["ice", "asleep", "smoke"],
    style: ["loud", "quiet"],
    layout: ["stack", "line"],
    title: ["cache", "state", "none"],
    color: ["leitstand", "fire"]
  };
  var POSES = ["front", "watch", "warm", "shiver", "scarf", "huddle", "ice", "asleep", "pale"];
  var coldMs = (ttlMs) => Math.min(COLD_MS, ttlMs / 3);
  function phase({ now, lastRequestAt, ttlMs }) {
    if (lastRequestAt === null)
      return { kind: "unlit" };
    const remaining = ttlMs - (now - lastRequestAt);
    if (remaining <= 0)
      return { kind: "expired", since: -remaining };
    if (remaining < coldMs(ttlMs))
      return { kind: "cold", remaining, cold: 1 - remaining / coldMs(ttlMs) };
    return { kind: "burning", remaining };
  }
  function intensity(p, ttlMs) {
    const cold = coldMs(ttlMs);
    if (p.kind === "burning")
      return 0.4 + 0.6 * ((p.remaining - cold) / Math.max(1, ttlMs - cold));
    if (p.kind === "cold")
      return 0.1 + 0.22 * (1 - p.cold);
    return 0;
  }
  function clock(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000));
    if (s >= 600)
      return `${Math.ceil(s / 60)}m`;
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  }
  var clamp = (n, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, n));
  var lerp = (a, b, t) => a + (b - a) * t;
  var mix = (c1, c2, t) => {
    const ch = (s) => Math.round(lerp(c1 >> s & 255, c2 >> s & 255, t)) << s;
    return ch(16) | ch(8) | ch(0);
  };
  function derive(inp, look) {
    const p = phase(inp);
    const since = inp.throwAt === null ? Infinity : inp.now - inp.throwAt;
    const throwMs = since >= 0 && since < THROW_MS ? since : null;
    const flare = since >= T_IMPACT ? 0.75 * Math.exp(-(since - T_IMPACT) / 1400) : 0;
    const fire = clamp(intensity(p, inp.ttlMs) + flare);
    const sparks = fire > 0.5 ? (fire - 0.45) * (look.burning === "steady" ? 0.6 : 0.9) : 0;
    const s = { kind: p.kind, fire, sparks, smoke: 0, throwMs, pose: "front", chill: 0, snow: 0, fraction: 0, value: "" };
    if (p.kind === "burning") {
      s.pose = look.burning === "warm" ? "warm" : "watch";
      s.smoke = look.burning === "plume" ? 0.25 + 0.4 * fire : 0;
      s.fraction = p.remaining / inp.ttlMs;
      s.value = clock(p.remaining);
    } else if (p.kind === "cold") {
      s.pose = look.cold;
      s.smoke = 0.6;
      s.snow = p.cold * 0.6;
      s.chill = p.cold * (look.cold === "scarf" ? 0.3 : 0.5);
      s.fraction = p.remaining / inp.ttlMs;
      s.value = clock(p.remaining);
    } else if (p.kind === "expired") {
      s.pose = look.expired === "smoke" ? "pale" : look.expired;
      s.smoke = look.expired === "smoke" ? 0.6 : 0.25;
      s.snow = look.expired === "ice" ? 0.7 : look.expired === "asleep" ? 0.5 : 0;
      s.chill = look.expired === "ice" ? 0.55 : 0.4;
      s.value = look.bar.title === "state" ? clock(p.since) : "out";
    }
    if (throwMs !== null)
      s.chill = 0;
    return s;
  }
  var STATE_WORD = { unlit: "unlit", burning: "burning", cold: "cooling", expired: "expired" };
  var DOT = "·";
  var RAMP = ["░", "░", "▒", "▓"];
  var fill = (pct, width) => Math.max(0, Math.min(width, Math.round(pct / 100 * width)));
  function meter(pct, width) {
    const n = fill(pct, width);
    return ["━".repeat(n), "─".repeat(width - n)];
  }
  function loudMeter(pct, width) {
    const n = fill(pct, width);
    const fade = n === width ? [] : [...RAMP].reverse().slice(0, Math.min(2, n));
    return ["▓".repeat(n - fade.length) + fade.join(""), DOT.repeat(width - n)];
  }
  function pick(table, name) {
    return table[name] ?? Object.values(table)[0];
  }
  function geometry(look) {
    const clawd = pick(CLAWDS, look.clawd);
    const furnace = pick(FURNACES, look.furnace);
    const thrown = pick(THROWN, look.thrown);
    const stageH = look.size === 75 ? 12 : 10;
    const homeX = artWidth(thrown.pile) + 1;
    const furnaceX = homeX + 14;
    const stageW = furnaceX + artWidth(furnace.art);
    const labelW = look.bar.layout === "stack" ? look.bar.width : look.bar.width + 5;
    const gap = 1;
    return {
      clawd,
      furnace,
      thrown,
      stageH,
      stageW,
      homeX,
      furnaceX,
      labelW,
      gap,
      throwX: homeX + 1,
      clawdY: stageH - 8,
      furnaceY: stageH - furnace.art.length,
      columns: labelW + gap + stageW,
      rows: stageH / 2
    };
  }
  function lineColumns(look) {
    return (look.bar.title === "none" ? 0 : 8) + look.bar.width + 5;
  }
  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = a + 1831565813 >>> 0;
      let t = a;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function createScene(seed = 7) {
    const rnd = rng(seed);
    let heat = new Float32Array(0);
    let parts = [];
    let burstDone = false;
    let frameNo = 0;
    let g;
    let px = new Int32Array(0);
    let glyph = new Int32Array(0);
    let glyphFg = new Int32Array(0);
    const put = (x, y, c) => {
      x = Math.round(x);
      y = Math.round(y);
      if (x >= 0 && y >= 0 && x < g.stageW && y < g.stageH)
        px[y * g.stageW + x] = c;
    };
    const sprite = (art, x, y, tint) => {
      art.forEach((line, j) => {
        for (let i = 0;i < line.length; i++) {
          const c = PAL[line[i]];
          if (c !== undefined)
            put(x + i, y + j, tint ? tint(c) : c);
        }
      });
    };
    const text = (col, row, s, fg) => {
      [...s].forEach((ch, i) => {
        if (col + i < 0 || col + i >= g.columns)
          return;
        glyph[row * g.columns + col + i] = ch.codePointAt(0);
        glyphFg[row * g.columns + col + i] = fg;
      });
    };
    function resize(look) {
      const next = geometry(look);
      const isNew = !g || next.stageW !== g.stageW || next.stageH !== g.stageH || next.columns !== g.columns || next.furnace !== g.furnace;
      if (!g || next.furnace !== g.furnace)
        heat = new Float32Array(next.furnace.mouth.w * next.furnace.mouth.h);
      if (isNew) {
        px = new Int32Array(next.stageW * next.stageH);
        glyph = new Int32Array(next.columns * next.rows);
        glyphFg = new Int32Array(next.columns * next.rows);
        parts = [];
      }
      g = next;
    }
    function stepFire(level) {
      const { w, h } = g.furnace.mouth;
      const decay = lerp(0.7, 0.2, level);
      for (let y = 0;y < h - 1; y++) {
        for (let x = 0;x < w; x++) {
          const sx = clamp(x + Math.round(rnd() * 2 - 1), 0, w - 1);
          heat[y * w + x] = Math.max(0, heat[(y + 1) * w + sx] - rnd() * decay);
        }
      }
      for (let x = 0;x < w; x++) {
        const edge = 1 - 0.45 * Math.abs((x - (w - 1) / 2) / ((w - 1) / 2)) ** 2;
        const ember = level < 0.25 ? rnd() < 0.5 ? 1 : 0.35 : 1;
        const fuel = level + 0.3 * clamp((level - 0.3) / 0.4);
        heat[(h - 1) * w + x] = level <= 0 ? 0 : clamp(fuel) * edge * ember * (0.75 + 0.25 * rnd());
      }
    }
    function drawFire(level) {
      const { mouth, art } = g.furnace;
      const ox = g.furnaceX + mouth.x;
      const oy = g.furnaceY + mouth.y;
      const isInside = (x, y) => art[mouth.y + y]?.[mouth.x + x] === "D";
      const glow = mix(PAL.w, 13910031, clamp(level * 1.4));
      for (let x = 1;x < mouth.w - 1; x++) {
        if (isInside(x, mouth.h - 1))
          put(ox + x, oy + mouth.h - 1, x === 2 ? PAL.o : x % 2 === 0 ? glow : PAL.w);
      }
      if (level <= 0) {
        for (let x = 1;x < mouth.w - 1; x += 2)
          if (isInside(x, mouth.h - 2))
            put(ox + x, oy + mouth.h - 2, ASH);
        return;
      }
      for (let y = 0;y < mouth.h; y++) {
        for (let x = 0;x < mouth.w; x++) {
          const v = heat[y * mouth.w + x];
          if (v < 0.14 || !isInside(x, y))
            continue;
          put(ox + x, oy + y, FLAME[Math.min(FLAME.length - 1, Math.floor((v - 0.14) / 0.8 * FLAME.length))]);
        }
      }
    }
    function spawn(s) {
      const { pipe } = g.furnace;
      const pipeX = g.furnaceX + pipe.x + Math.floor(rnd() * pipe.w);
      const pipeY = g.furnaceY - 1;
      if (rnd() < s.sparks)
        parts.push({ x: pipeX, y: pipeY, life: 0, max: 1 + Math.floor(rnd() * 3), dx: 0, kind: "spark" });
      if (frameNo % 2 === 0 && rnd() < s.smoke * 0.6)
        parts.push({ x: pipeX, y: pipeY, life: 0, max: 5, dx: 0, kind: "smoke" });
      if (rnd() < s.snow)
        parts.push({ x: Math.floor(rnd() * g.stageW), y: 0, life: 0, max: g.stageH + 2, dx: 0, kind: "snow" });
    }
    function burst() {
      const { mouth, pipe } = g.furnace;
      for (let i = 0;i < 5; i++) {
        parts.push({ x: g.furnaceX + mouth.x + 1 + Math.floor(rnd() * (mouth.w - 2)), y: g.furnaceY + mouth.y - 1, life: 0, max: 2 + Math.floor(rnd() * 2), dx: rnd() < 0.5 ? -1 : 1, kind: "spark" });
      }
      for (let i = 0;i < 2; i++)
        parts.push({ x: g.furnaceX + pipe.x + i, y: g.furnaceY - 1 - i, life: 0, max: 2 + i, dx: 0, kind: "spark" });
    }
    function moveParticles() {
      parts = parts.filter((p) => {
        p.life += 1;
        if (p.kind === "spark") {
          p.y -= 1;
          if (p.dx && p.life % 2 === 0)
            p.x += p.dx;
          else if (rnd() < 0.3)
            p.x += rnd() < 0.5 ? -1 : 1;
        } else if (p.kind === "smoke") {
          if (p.life % 2 === 0) {
            p.y -= 1;
            p.x += 1;
          }
        } else {
          p.y += 1;
          if (rnd() < 0.25)
            p.x += rnd() < 0.5 ? -1 : 1;
        }
        return p.life <= p.max && p.y >= 0 && p.y < g.stageH;
      });
    }
    function drawParticles(isSnow) {
      const { mouth } = g.furnace;
      const mx = g.furnaceX + mouth.x;
      const my = g.furnaceY + mouth.y;
      for (const p of parts) {
        if (p.kind === "snow" !== isSnow)
          continue;
        if (p.kind === "spark")
          put(p.x, p.y, FLAME[clamp(5 - Math.floor(p.life / p.max * 3), 2, 5)]);
        else if (p.kind === "smoke")
          put(p.x, p.y, mix(9078144, 4867394, p.life / p.max));
        else if (!(p.x >= mx && p.x < mx + mouth.w && p.y >= my && p.y < my + mouth.h))
          put(p.x, p.y, SNOW[p.life % 2]);
      }
    }
    function drawThrow(t, art, thrown) {
      const { homeX, throwX, clawdY, furnaceX, furnaceY } = g;
      const { mouth } = g.furnace;
      const held = thrown.held;
      const hw = artWidth(held);
      if (t < T_CROUCH) {
        sprite(art.crouch, homeX, clawdY + 1);
        sprite(held, homeX - hw + 1, g.stageH - 3);
      } else if (t < T_LIFT) {
        const k = (t - T_CROUCH) / (T_LIFT - T_CROUCH);
        const x = Math.round(lerp(homeX, throwX, k));
        const hop = k > 0.25 && k < 0.75 ? 1 : 0;
        sprite(art.up, x, clawdY - hop);
        sprite(held, x + 6 - Math.ceil(hw / 2), clawdY - hop - held.length);
      } else if (t < T_IMPACT) {
        const k = (t - T_LIFT) / (T_IMPACT - T_LIFT);
        sprite(art.right, throwX, clawdY);
        const fromX = throwX + 6 - Math.ceil(hw / 2);
        const fromY = clawdY - held.length;
        const toX = furnaceX + mouth.x + Math.floor((mouth.w - hw) / 2);
        const toY = furnaceY + mouth.y + mouth.h - held.length - 1;
        sprite(held, lerp(fromX, toX, k), lerp(fromY, toY, k) - 3 * Math.sin(Math.PI * k));
      } else {
        const k = (t - T_IMPACT) / (THROW_MS - T_IMPACT);
        const x = Math.round(lerp(throwX, homeX, k));
        const hop = k > 0.1 && k < 0.35 || k > 0.6 && k < 0.85 ? 1 : 0;
        sprite(hop ? art.blink : art.right, x, clawdY - hop);
      }
    }

    slider(p, "fire", { min: 0, max: 1, step: 0.01, get: () => lastState?.fire ?? 0, set: (v) => {
      hold();
      S.furnace.fire = v;
    }, show: pct, follower: S.furnace });
    slider(p, "sparks", { min: 0, max: 1, step: 0.01, get: () => lastState?.sparks ?? 0, set: (v) => {
      hold();
      S.furnace.sparks = v;
    }, show: pct, follower: S.furnace });
    slider(p, "smoke", { min: 0, max: 1, step: 0.01, get: () => lastState?.smoke ?? 0, set: (v) => {
      hold();
      S.furnace.smoke = v;
    }, show: pct, follower: S.furnace });
  }
  {
    const p = panel("Thrown", S.thrown, "Scrub the throw: crouch, lift, fly, hop back.");
    choices(p, "object", Object.keys(THROWN), () => S.look.thrown, (v) => {
      S.look.thrown = v;
    });
    const part = (t) => t >= THROW_MS ? "done" : t < 300 ? "crouch" : t < 750 ? "lift" : t < 1150 ? "fly" : "hop";
    slider(p, "throw", {
      min: 0,
      max: THROW_MS,
      step: 25,
      get: () => S.thrown.follow ? lastState?.throwMs ?? THROW_MS : S.thrown.throwMs,
      set: (v) => {
        S.thrown.throwMs = v;
      },
      show: part,
      follower: S.thrown
    });
  }
  {
    const p = panel("Clawd", S.clawd);
    choices(p, "art", Object.keys(CLAWDS), () => S.look.clawd, (v) => {
      S.look.clawd = v;
    });
    choices(p, "pose", POSES, () => S.clawd.follow ? lastState?.pose ?? "front" : S.clawd.pose, (v) => {
      S.clawd.pose = v;
      S.clawd.chill = lastState?.chill ?? 0;
    }, S.clawd);
    slider(p, "chill", { min: 0, max: 1, step: 0.01, get: () => S.clawd.follow ? lastState?.chill ?? 0 : S.clawd.chill, set: (v) => {
      if (S.clawd.follow)
        S.clawd.pose = lastState?.pose ?? "front";
      S.clawd.chill = v;
    }, show: pct, follower: S.clawd });
  }
  {
    const p = panel("Weather", S.weather);
    slider(p, "snow", { min: 0, max: 1, step: 0.01, get: () => S.weather.follow ? lastState?.snow ?? 0 : S.weather.snow, set: (v) => {
      S.weather.snow = v;
    }, show: pct, follower: S.weather });
  }
  {
    let holdBar = function() {
      if (S.bar.follow && lastState)
        Object.assign(S.bar, { kind: lastState.kind, fraction: lastState.fraction, value: lastState.value });
    };
    const p = panel("Bar", S.bar, "Style and layout are the design; state, fill and value follow the clock.");
    choices(p, "style", CHOICES.style, () => S.look.bar.style, (v) => {
      S.look.bar.style = v;
    });
    choices(p, "layout", CHOICES.layout, () => S.look.bar.layout, (v) => {
      S.look.bar.layout = v;
    });
    choices(p, "title", CHOICES.title, () => S.look.bar.title, (v) => {
      S.look.bar.title = v;
    });
    choices(p, "color", CHOICES.color, () => S.look.bar.color, (v) => {
      S.look.bar.color = v;
    });
    slider(p, "width", { min: 6, max: 14, step: 1, get: () => S.look.bar.width, set: (v) => {
      S.look.bar.width = v;
    }, show: (v) => String(v) });
    choices(p, "state", KINDS, () => S.bar.follow ? lastState?.kind ?? "unlit" : S.bar.kind, (v) => {
      holdBar();
      S.bar.kind = v;
    }, S.bar);
    slider(p, "fill", { min: 0, max: 1, step: 0.01, get: () => S.bar.follow ? lastState?.fraction ?? 0 : S.bar.fraction, set: (v) => {
      holdBar();
      S.bar.fraction = v;
    }, show: pct, follower: S.bar });
    const value = el("input", { type: "text" });
    value.oninput = () => {
      holdBar();
      S.bar.value = value.value;
      S.bar.follow = false;
      save();
    };
    syncs.push(() => {
      if (document.activeElement !== value)
        value.value = S.bar.follow ? lastState?.value ?? "" : S.bar.value;
    });
    p.append(el("div", { className: "row" }, el("span", {}, "value"), value, el("span")));
  }
  {
    const p = panel("Terminal");
    slider(p, "columns", { min: 30, max: 200, step: 1, get: () => S.view.columns, set: (v) => {
      S.view.columns = v;
    }, show: (v) => String(v) });
    slider(p, "zoom", { min: 5, max: 16, step: 1, get: () => S.view.cell, set: (v) => {
      S.view.cell = v;
    }, show: (v) => `${v}px` });
    choices(p, "theme", ["dark", "light"], () => S.view.theme, (v) => {
      S.view.theme = v;
    });
    choices(p, "neighbour", ["off", "on"], () => S.view.neighbour ? "on" : "off", (v) => {
      S.view.neighbour = v === "on";
    });
    choices(p, "outline", ["off", "on"], () => S.view.outline ? "on" : "off", (v) => {
      S.view.outline = v === "on";
    });
    const size = el("p", { className: "note" });
    syncs.push(() => {
      const g = geometry(S.look);
      size.textContent = lastSize === "full" ? `Scene: ${g.columns} x ${g.rows} cells (the first version was 53 x 8).` : lastSize === "line" ? `Too narrow for the scene (needs ${g.columns + MARK_COLUMNS} columns): one line.` : "Too narrow: the mod draws nothing.";
    });
    p.append(size, el("p", { className: "note" }, "neighbour: another plugin in the band (leitstand style); the furnace keeps to its own columns on the right."));
  }
  {
    const p = panel("Export", undefined, "Copy this and paste it to Claude, or over hooks/look.ts.");
    const area = el("textarea", { readOnly: true });
    const copy = el("button", { textContent: "Copy look.ts" });
    copy.onclick = async () => {
      try {
        await navigator.clipboard.writeText(area.value);
      } catch {
        area.select();
        document.execCommand("copy");
      }
      copy.textContent = "Copied";
      setTimeout(() => {
        copy.textContent = "Copy look.ts";
      }, 1200);
    };
    const follow = el("button", { textContent: "Follow clock everywhere" });
    follow.onclick = () => {
      for (const f of [S.furnace, S.thrown, S.clawd, S.weather, S.bar])
        f.follow = true;
      save();
      sync();
    };
    const reset = el("button", { textContent: "Reset all" });
    reset.onclick = () => {
      localStorage.removeItem(STORE);
      S = clone(DEFAULTS);
      location.reload();
    };
    syncs.push(() => {
      area.value = lookTs(S.look);
    });
    p.append(area, el("div", { className: "choices" }, copy, follow, reset));
  }
  function lookTs(l) {
    const q = (s) => `'${s}'`;
    return [
      "// The design the mod draws. tools/tuner.html picks one and its Export button copies it here.",
      "import type { Look } from './scene'",
      "",
      "export const LOOK: Look = {",
      `  size: ${l.size},`,
      `  clawd: ${q(l.clawd)},`,
      `  furnace: ${q(l.furnace)},`,
      `  thrown: ${q(l.thrown)},`,
      `  burning: ${q(l.burning)},`,
      `  cold: ${q(l.cold)},`,
      `  expired: ${q(l.expired)},`,
      `  bar: { style: ${q(l.bar.style)}, width: ${l.bar.width}, layout: ${q(l.bar.layout)}, title: ${q(l.bar.title)}, color: ${q(l.bar.color)} },`,
      "}",
      ""
    ].join(`
`);
  }
  function advance(ms) {
    now += ms;
    if (lastRequestAt !== null)
      lastRequestAt -= ms * (S.clock.rate - 1);
    if (pendingRequest !== null && now >= pendingRequest) {
      lastRequestAt = pendingRequest;
      pendingRequest = null;
    }
  }
  var status = document.getElementById("status");
  var acc = 0;
  var then = performance.now();
  var saveAt = 0;
  function loop(t) {
    const dt = Math.min(500, t - then);
    then = t;
    if (isPlaying)
      acc += dt * S.clock.speed;
    let ticks = 0;
    while (acc >= FRAME_MS && ticks < 4) {
      acc -= FRAME_MS;
      advance(FRAME_MS);
      frame();
      ticks++;
    }
    if (acc > FRAME_MS)
      acc = 0;
    if (ticks || !lastState) {
      if (!lastState)
        frame();
      paintTerminal();
      paintStrip();
      sync();
      const ph = phase(inputs());
      status.textContent = ph.kind === "unlit" ? "unlit: no request yet" : ph.kind === "expired" ? `expired ${clock(ph.since)} ago` : `${ph.kind === "cold" ? "cold" : "burning"}: ${clock(ph.remaining)} left of ${S.clock.ttlMin}m`;
      if (t > saveAt) {
        save();
        saveAt = t + 1000;
      }
    }
  }
  window.addEventListener("keydown", (e) => {
    if (e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement)
      return;
    if (e.key === "p")
      sendPrompt();
    else if (e.key === " ") {
      isPlaying = !isPlaying;
      e.preventDefault();
    } else if (e.key === ".") {
      isPlaying = false;
      advance(FRAME_MS);
      frame();
      paintTerminal();
      paintStrip();
      sync();
    } else
      return;
    sync();
  });
  frame();
  paintTerminal();
  paintStrip();
  sync();
  setInterval(() => loop(performance.now()), 25);
})();
</script>
</body>
</html>
