<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clawd fireplace</title>
<style>
  body { --bg: #161514; --panel: #1f1e1c; --line: #34322f; --text: #e8e4dc; --dim: #8a8580; --clay: #d97757; }
  body[data-theme=light] { --bg: #f0eee6; --panel: #faf9f5; --line: #d6d1c4; --text: #282828; --dim: #77726b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 15px; margin: 0; color: var(--clay); }
  label { display: flex; align-items: center; gap: 6px; color: var(--dim); }
  output, #status { font-family: Consolas, monospace; color: var(--dim); min-width: 52px; }
  #keys { margin-left: auto; color: var(--dim); }
  kbd { border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-family: Consolas, monospace; }
  button, select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 3px 9px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--dim); }
  button#send { background: var(--clay); border-color: var(--clay); color: #1a1a1a; font-weight: 600; }
  input[type=range] { width: 200px; accent-color: var(--clay); }
  #stage { padding: 14px 16px 6px; overflow-x: auto; }
  #status { padding: 0 16px 12px; }
  canvas { display: block; }
  #gallery { display: flex; flex-wrap: wrap; gap: 12px; padding: 4px 16px 24px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  .card span { display: block; color: var(--dim); margin-bottom: 4px; }
</style>
</head>
<body>
<header>
  <h1>Clawd fireplace</h1>
  <label>time left <input id="left" type="range" min="-15" max="60" step="0.1" value="35"><output id="leftOut"></output></label>
  <label>cache <select id="ttl"><option value="60">1 hour</option><option value="5">5 min</option></select></label>
  <label>speed <select id="speed"><option value="1">1x</option><option value="30">30x</option><option value="300">300x</option></select></label>
  <label>terminal <input id="width" type="range" min="30" max="160" value="120"><output id="widthOut"></output></label>
  <button id="send">send prompt</button>
  <button id="unlit">unlit</button>
  <button id="play">pause</button>
  <button id="theme">dark / light</button>
  <span id="keys"><kbd>p</kbd> send prompt &nbsp; <kbd>space</kbd> play/pause</span>
</header>
<section id="stage"><canvas id="live"></canvas></section>
<div id="status"></div>
<section id="gallery"></section>
<script>

    c: 12478541,
    E: 1315860,
    B: 4882369,
    b: 3104150,
    R: 9740464,
    P: 6253434,
    H: 4608352,
    D: 1839888,
    k: 3348751,
    I: 2763312,
    L: 9132587,
    l: 6175258,
    W: 12488284,
    a: 5985616,
    F: 16096779,
    f: 15680580,
    y: 16638023,
    s: 10134445,

      "..cCCCCCCCCCCCC..",

      "..cCCECCCCCCCEC..",
      "..cCCECCCCCCCEC..",
      "cCCCCCCCCCCCCCCCC",
      "cCCCCCCCCCCCCCCCC",
      "..cCCCCCCCCCCCC..",
      "..cCCCCCCCCCCCC..",
      "..c.C.......C.C..",

      "..CCECCCCCCCECC..",
      "..CCECCCCCCCECC..",
      "CCCCCCCCCCCCCCCCC",
      "CCCCCCCCCCCCCCCCC",
      "..CCCCCCCCCCCCC..",
      "..CCCCCCCCCCCCC..",
      "..C.C.......C.C..",
      "..C.C.......C.C.."

      ".................",
      "..cCCCCCCCCCCCC..",
      "..cCCCCCCCCCCCC..",
      "..cCCCCCCCCCCCC..",
      "..cCEECCCCCCEEC..",
      "cCCCCCCCCCCCCCC..",
      "cCCCCCCCCCCCCCC..",
      "..cCCCCCCCCCCCCCC",
      "..cCCCCCCCCCCCCCC",

      "..cCCCCCCCCCCCC....",
      "..cCCECCCCCCCEC....",
      "..cCCECCCCCCCEC..CC",
      "..cCCCCCCCCCCCC.CC.",
      "cCCCCCCCCCCCCCCCC..",
      "cCCCCCCCCCCCCCC....",
      "..cCCCCCCCCCCCC....",
      "..cCCCCCCCCCCCC....",
      "..c.C.......C.C....",
      "..c.C.......C.C...."
    ],
    hop: [
      "..cCCCCCCCCCCCC..",
      "..cCCCCCCCCCCCC..",
      "..cCCECCCCCCCEC..",
      "..cCCECCCCCCCEC..",
      "cCCCCCCCCCCCCCCCC",
      "cCCCCCCCCCCCCCCCC",

      "..cCCCCCCCCCCCC..",

    "",
    "",
    "",
    "",
    "..bBBBBBBBBBBBB..",
    "..bbbbbbbbbbbBB..",
    "............bB...",
    "............Bb..."

    "LLLLW.",
    "llllW.",
    ".LLLLW",
    ".llllW"

    "HHHHHHHHHHHHHHHHHHHH",

    ".PPPRRDDDDDDDDRRPPH.",
    ".PPRDDkkDkkkDkkDRPH.",
    ".PRDkkDkkkDkkkDkDRH.",
    ".PRDkkkDkkkDkkkDDRH.",
    ".PRDkDkkkDkkkDkkDRH.",

    ".PRIlllllIlllllIIRH.",
    "RRRRRRRRRRRRRRRRRRRR",
    "HHHHHHHHHHHHHHHHHHHH"

    "..F.y..y.F..",
    "y..y.F..F.F.",
    ".F..F.F..F.y",
    "F.F..F.y..y.",
    ".F.y..y.F..F",
    "..y.F..F.F..",
    "F..F.F..F.y.",
    ".F..F.y..y.F",
    "F.y..y.F..F.",
    ".y.F..F.F..F",
    "..F.F..F.y..",
    "F..F.y..y.F.",
    ".y..y.F..F.F",
    "y.F..F.F..F.",
    ".F.F..F.y..y",

  // hooks/scene.ts
  var COLD_MS = 10 * 60 * 1000;
  var T_PICK = 375;
  var T_LIFT = 750;

  var T_IMPACT = 1375;

      }

        const bottom = px[(r * 2 + 1) * w + x];

          continue;

          cells[at] = 9600;
          cells[at + 1] = top;
        } else if (top === NONE) {
          cells[at] = 9604;
          cells[at + 1] = bottom;

        for (let k = 0;k < 3; k++) {

  var now = T0;

    left.min = String(-ttlMs / MIN / 4);
    left.max = String(ttlMs / MIN);
    lastRequestAt = now - ttlMs / 2;
  };
  $("unlit").onclick = () => {
    lastRequestAt = null;
    pendingRequest = null;
  };
  var send = () => {
    throwAt = now;
    pendingRequest = now + 200;
  };
  $("send").onclick = send;
  var togglePlay = () => {
    isPlaying = !isPlaying;
    $("play").textContent = isPlaying ? "pause" : "play";
  };
  $("play").onclick = togglePlay;
  var setTheme = (t) => {
    theme = t;
    document.body.dataset.theme = t;
    localStorage.setItem("clawd-fireplace-theme", t);
  };
  $("theme").onclick = () => setTheme(theme === "dark" ? "light" : "dark");
  setTheme(theme);
  document.addEventListener("keydown", (e) => {
    if (e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement)
      return;
    if (e.key === "p")
      send();
    else if (e.key === " ") {
      e.preventDefault();
      togglePlay();
    }
  });
  function drawLive() {
    const cw = 9, ch = cw * 2;
    const width = Number(widthIn.value);
    widthOut.value = `${width} cols`;
    const inp = { now, lastRequestAt, ttlMs, throwAt };
    const d = band(inp, width);
    const t = THEMES[theme];
    const bandRows = d?.rows ?? 0;
    const ctx = size(live, width * cw, (bandRows + 5) * ch);
    ctx.font = `${Math.round(ch * 0.72)}px "Cascadia Mono", Consolas, Menlo, monospace`;
    ctx.fillStyle = t.dim;
    ctx.fillText("⏺ the transcript ends here", 0, ch / 2);
    if (d) {
      cells(ctx, d, width - MARK_COLUMNS - d.columns, 1, cw);
      ctx.fillStyle = t.dim;
      ctx.fillText("[-]", (width - 4) * cw, (bandRows + 0.5) * ch);
    }
    const rule = (r) => {
      ctx.fillStyle = t.rule;
      ctx.fillRect(0, (r + 0.5) * ch, width * cw, 1);
    };
    rule(bandRows + 2);
    ctx.fillStyle = t.fg;
    ctx.fillText("❯", cw, (bandRows + 3.5) * ch);
    rule(bandRows + 4);
    const s = derive(inp);
    const m = lastRequestAt === null ? null : (ttlMs - (now - lastRequestAt)) / MIN;
    leftOut.value = m === null ? "unlit" : `${m.toFixed(1)}m`;
    if (m !== null && document.activeElement !== left)
      left.value = String(m);
    status.textContent = `${s.kind} · ${s.value}${d ? "" : " · too narrow, nothing drawn"}${d && d.rows === 1 ? " · the row alone" : ""}`;
  }
  var SHOTS = [
    { title: "unlit, first prompt", lastAgo: null, isThrow: true },
    { title: "burning, 50m left", lastAgo: 10 * MIN },
    { title: "burning, 20m left", lastAgo: 40 * MIN },
    { title: "prompt at 20m left", lastAgo: 40 * MIN, isThrow: true },
    { title: "cooling, 6m left", lastAgo: 54 * MIN },
    { title: "cooling, 1m left", lastAgo: 59 * MIN },
    { title: "expired", lastAgo: 70 * MIN }
  ];
  var LOOP_MS = THROW_MS + 2000;
  var gallery = $("gallery");
  var shotCanvases = SHOTS.map((s) => {
    const card = document.createElement("div");
    card.className = "card";
    const label = document.createElement("span");
    label.textContent = s.title;
    const c = document.createElement("canvas");
    card.append(label, c);
    gallery.append(card);
    return c;
  });
  function drawGallery(clock) {
    const cw = 6;
    SHOTS.forEach((s, i) => {
      const t = clock % LOOP_MS;
      const at = T0 + t;
      const last = s.isThrow && t > 200 ? T0 + 200 : s.lastAgo === null ? null : T0 - s.lastAgo;
      const d = frame(derive({ now: at, lastRequestAt: last, ttlMs: 60 * MIN, throwAt: s.isThrow ? T0 : null }), at);
      cells(size(shotCanvases[i], d.columns * cw, d.rows * cw * 2), d, 0, 0, cw);
    });
  }
  var galleryClock = 0;
  setInterval(() => {
    if (isPlaying) {
      const isThrowing = throwAt !== null && now - throwAt < THROW_MS + 500;
      now += FRAME_MS * (isThrowing ? 1 : Number(speedIn.value));
      galleryClock += FRAME_MS;
      if (pendingRequest !== null && now >= pendingRequest) {
        lastRequestAt = pendingRequest;
        pendingRequest = null;
      }
    }
    drawLive();
    drawGallery(galleryClock);
  }, FRAME_MS);
})();
</script>
</body>
</html>
