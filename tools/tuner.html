<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clawd fireplace</title>
<style>
  body { --bg: #161514; --panel: #1f1e1c; --line: #34322f; --text: #e8e4dc; --dim: #8a8580; --clay: #d97757; }
  body[data-theme=light] { --bg: #f0eee6; --panel: #faf9f5; --line: #d6d1c4; --text: #282828; --dim: #77726b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 15px; margin: 0; color: var(--clay); }
  label { display: flex; align-items: center; gap: 6px; color: var(--dim); }
  output, #status { font-family: Consolas, monospace; color: var(--dim); min-width: 52px; }
  #keys { margin-left: auto; color: var(--dim); }
  kbd { border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-family: Consolas, monospace; }
  button, select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 3px 9px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--dim); }
  button#send { background: var(--clay); border-color: var(--clay); color: #1a1a1a; font-weight: 600; }
  input[type=range] { width: 200px; accent-color: var(--clay); }
  #stage { padding: 14px 16px 6px; overflow-x: auto; }
  #status { padding: 0 16px 12px; }
  canvas { display: block; }
  #gallery { display: flex; flex-wrap: wrap; gap: 12px; padding: 4px 16px 24px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  .card span { display: block; color: var(--dim); margin-bottom: 4px; }
</style>
</head>
<body>
<header>
  <h1>Clawd fireplace</h1>
  <label>time left <input id="left" type="range" min="-15" max="60" step="0.1" value="35"><output id="leftOut"></output></label>
  <label>speed <select id="speed"><option value="1">1x</option><option value="30">30x</option><option value="300">300x</option></select></label>
  <label>terminal <input id="width" type="range" min="20" max="160" value="100"><output id="widthOut"></output></label>
  <button id="send">send prompt</button>
  <button id="unlit">unlit</button>
  <button id="play">pause</button>
  <button id="theme">dark / light</button>
  <span id="keys"><kbd>p</kbd> send prompt &nbsp; <kbd>space</kbd> play/pause</span>
</header>
<section id="stage"><canvas id="live"></canvas></section>
<div id="status"></div>
<section id="gallery"></section>
<script>
(() => {
  // hooks/sprites.ts
  var PAL = {
    C: 14120791,
    c: 12478541,
    E: 1315860,
    B: 4882369,
    b: 3104150,
    R: 9740464,
    P: 6253434,
    H: 4608352,
    D: 1839888,
    k: 3348751,
    L: 9132587,
    l: 6175258,
    W: 12488284,
    a: 5985616,
    F: 16096779,
    f: 15680580,
    y: 16638023,
    s: 10134445,
    G: 7041664
  };
  var artWidth = (art) => Math.max(0, ...art.map((l) => l.length));
  var CLAWD = {
    stand: [
      "..cCCCCCCCCCCCC...",
      "..cCCCCCCCCCCCC...",
      "..cCCECCCCCCCEC...",
      "..cCCECCCCCCCEC...",
      "cCCCCCCCCCCCCCCC..",
      "cCCCCCCCCCCCCCCC..",
      "..cCCCCCCCCCCCC...",
      "..cCCCCCCCCCCCC...",
      "..c.C.......C.C..."
    ],
    warm: [
      "..cCCCCCCCCCCCC...",
      "..cCCCCCCCCCCCC...",
      "..cCCECCCCCCCEC...",
      "..cCCECCCCCCCEC...",
      "..cCCCCCCCCCCCCCCC",
      "..cCCCCCCCCCCCCCCC",
      "..cCCCCCCCCCCCCcc.",
      "..cCCCCCCCCCCCC...",
      "..c.C.......C.C..."
    ],
    rub: [
      "..cCCCCCCCCCCCC...",
      "..cCCCCCCCCCCCC...",
      "..cCCECCCCCCCEC...",
      "..cCCECCCCCCCEC...",
      "..cCCCCCCCCCCCCCC.",
      "..cCCCCCCCCCCCCCC.",
      "..cCCCCCCCCCCCCccc",
      "..cCCCCCCCCCCCC...",
      "..c.C.......C.C..."
    ],
    front: [
      "..CCCCCCCCCCCCC...",
      "..CCCCCCCCCCCCC...",
      "..CCCECCCCCCCEC...",
      "..CCCECCCCCCCEC...",
      "CCCCCCCCCCCCCCCC..",
      "CCCCCCCCCCCCCCCC..",
      "..CCCCCCCCCCCCC...",
      "..CCCCCCCCCCCCC...",
      "..C.C.......C.C..."
    ],
    step: [
      "..cCCCCCCCCCCCC...",
      "..cCCCCCCCCCCCC...",
      "..cCCECCCCCCCEC...",
      "..cCCECCCCCCCEC...",
      "cCCCCCCCCCCCCCCC..",
      "cCCCCCCCCCCCCCCC..",
      "..cCCCCCCCCCCCC...",
      "..cCCCCCCCCCCCC...",
      "...cC.......CC...."
    ],
    crouch: [
      "..................",
      "..cCCCCCCCCCCCC...",
      "..cCCECCCCCCCEC...",
      "..cCCCCCCCCCCCC...",
      "ccCCCCCCCCCCCCC...",
      "..cCCCCCCCCCCCC...",
      "..cCCCCCCCCCCCCCCC",
      "..cCCCCCCCCCCCC...",
      ".c..C.......C..C.."
    ],
    toss: [
      "..cCCCCCCCCCCCC...",
      "..cCCCCCCCCCCCC.CC",
      "..cCCECCCCCCCECC..",
      "..cCCECCCCCCCEC...",
      "cCCCCCCCCCCCCCC...",
      "cCCCCCCCCCCCCCC...",
      "..cCCCCCCCCCCCC...",
      "..cCCCCCCCCCCCC...",
      "..c.C.......C.C..."
    ],
    poke: [
      "..cCCCCCCCCCCCC...",
      "..cCCCCCCCCCCCC...",
      "..cCCECCCCCCCEC...",
      "..cCCECCCCCCCEC...",
      "cCCCCCCCCCCCCCCCCC",
      "cCCCCCCCCCCCCCCCCC",
      "..cCCCCCCCCCCCC...",
      "..cCCCCCCCCCCCC...",
      "..c.C.......C.C..."
    ]
  };
  var shut = (art) => art.map((l) => l.replaceAll("E", "C"));
  var turned = (art) => {
    const w = artWidth(art);
    return art.map((l) => [...l.padEnd(w, ".")].reverse().join(""));
  };
  var SCARF = [
    "",
    "",
    "",
    "",
    "..bBBBBBBBBBBBB",
    "..bbbbbbbbbbbBB",
    "..Bb",
    "..bB"
  ];
  var WOODPILE = [
    ".LLLW",
    "LLLLW",
    "llllW"
  ];
  var LOG = ["LLW", "llW"];
  var FIREPLACE = [
    "RRRRRRRRRRRRRR",
    ".HHHHHHHHHHHH.",
    ".PPRRRRRRRRPH.",
    ".PRDkkDkkDkRH.",
    ".PRkDkkDkkDRH.",
    ".PRDkDkkDkkRH.",
    ".PRLLWlLLLWRH.",
    "RRRRRRRRRRRRRR"
  ];
  var BED = { x: 3, y: 5, w: 8 };
  var LOGS_ROW = 6;
  var HEARTH_ROW = 7;
  var TIPS = [
    "..F.y..y",
    "y..y.F..",
    ".F..F.F.",
    "F.F..F.y",
    ".F.y..y.",
    "..y.F..F",
    "F..F.F..",
    ".F..F.y.",
    "F.y..y.F",
    ".y.F..F.",
    "..F.F..F",
    "F..F.y..",
    ".y..y.F.",
    "y.F..F.F",
    ".F.F..F.",
    "y..y.F.."
  ];
  var PUFFS = [[".s.", "sss"], ["ss"], ["s"]];

  // hooks/scene.ts
  var MIN = 60000;
  var TTL_MS = 60 * MIN;
  var COLD_MS = 20 * MIN;
  var LOW_MS = 5 * MIN;
  var FLICKER_EVERY_MS = 30000;
  var FLICKER_MS = 1500;
  var T_WALK = 500;
  var T_PICK = 750;
  var T_LIFT = 1000;
  var T_RELEASE = 1250;
  var T_IMPACT = 1625;
  var T_TURN = 1875;
  var T_BACK = 2000;
  var THROW_MS = 2750;
  var P_REACH = 250;
  var P_JABS = [500, 1000];
  var P_JAB_MS = 250;
  var P_DONE = 1500;
  var POKE_MS = 1750;
  var FLAME_MS = 160;
  var DEFAULT = 16777216;
  var NONE = -1;
  var TONE = { clay: 14251863, warn: 13666846, bad: 14242639, track: 6249560, dim: 9078144 };
  function phase({ now, lastRequestAt }) {
    if (lastRequestAt === null)
      return { kind: "unlit" };
    const remaining = TTL_MS - (now - lastRequestAt);
    if (remaining <= 0)
      return { kind: "expired", since: -remaining };
    if (remaining < COLD_MS)
      return { kind: "cold", remaining, cold: 1 - remaining / COLD_MS };
    return { kind: "burning", remaining };
  }
  var isColdStart = (now, lastRequestAt) => {
    const k = phase({ now, lastRequestAt }).kind;
    return k === "unlit" || k === "expired";
  };
  function intensity(p) {
    if (p.kind !== "burning")
      return 0;
    return 0.4 + 0.6 * ((p.remaining - COLD_MS) / (TTL_MS - COLD_MS));
  }
  function clock(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000));
    if (s >= 600)
      return `${Math.ceil(s / 60)}m`;
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  }
  var clamp = (n, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, n));
  var lerp = (a, b, t) => a + (b - a) * t;
  var mix = (c1, c2, t) => {
    const ch = (s) => Math.round(lerp(c1 >> s & 255, c2 >> s & 255, t)) << s;
    return ch(16) | ch(8) | ch(0);
  };
  var hash = (a, b) => {
    let t = Math.imul(a ^ 2654435769, 2246822507) ^ Math.imul(b + 1663821227, 3266489909);
    t ^= t >>> 15;
    t = Math.imul(t, 739982445);
    return ((t ^ t >>> 13) >>> 0) / 4294967296;
  };
  var within = (now, at, length) => {
    if (at === null)
      return null;
    const t = now - at;
    return t >= 0 && t < length ? t : null;
  };
  function derive(inp) {
    const p = phase(inp);
    const throwMs = within(inp.now, inp.throwAt, THROW_MS);
    const pokeMs = throwMs === null ? within(inp.now, inp.pokeAt, POKE_MS) : null;
    let flare = 0;
    const sinceThrow = inp.throwAt === null ? -1 : inp.now - inp.throwAt;
    if (sinceThrow >= T_IMPACT)
      flare = 0.8 * Math.exp(-(sinceThrow - T_IMPACT) / 1600);
    const sincePoke = inp.pokeAt === null ? -1 : inp.now - inp.pokeAt;
    for (const jab of P_JABS)
      if (sincePoke >= jab)
        flare = Math.max(flare, 0.5 * Math.exp(-(sincePoke - jab) / 700));
    const fire = throwMs !== null && throwMs < T_IMPACT ? 0 : clamp(intensity(p) + flare);
    const isStoked = pokeMs !== null && P_JABS.some((j) => pokeMs >= j && pokeMs < j + P_JAB_MS);
    const s = { kind: p.kind, fire, cold: 0, throwMs, pokeMs, isStoked, fraction: 0, value: "", isFlickerOff: false };
    if (p.kind === "burning" || p.kind === "cold") {
      s.fraction = p.remaining / TTL_MS;
      s.value = clock(p.remaining);
    }
    if (p.kind === "cold") {
      s.cold = p.cold;
      const t = inp.now % FLICKER_EVERY_MS;
      s.isFlickerOff = p.remaining < LOW_MS && t < FLICKER_MS && Math.floor(t / 250) % 2 === 0;
    }
    if (p.kind === "expired")
      s.value = "out";
    if (p.kind === "unlit")
      s.value = "–";
    return s;
  }
  var FULL = "▓";
  var RAMP = ["░", "░", "▒", "▓"];
  var TRACK = "·";
  function loudMeter(fraction, width) {
    const n = fraction <= 0 ? 0 : Math.max(1, Math.min(width, Math.round(fraction * width)));
    const fade = n === width ? [] : [...RAMP].reverse().slice(0, Math.min(2, n));
    return [FULL.repeat(n - fade.length) + fade.join(""), TRACK.repeat(width - n)];
  }
  var ROW = { bar: 12, value: 4 };
  var ROW_COLUMNS = ROW.bar + 1 + ROW.value;
  var TONES = { unlit: TONE.dim, burning: TONE.clay, cold: TONE.warn, expired: TONE.bad };
  function row(s) {
    const tone = TONES[s.kind];
    let [body, rest] = loudMeter(s.fraction, ROW.bar);
    if (s.isFlickerOff && body.length > 0) {
      body = body.slice(0, -1);
      rest = TRACK + rest;
    }
    return [
      [body, tone],
      [rest, s.kind === "expired" ? TONE.bad : TONE.track],
      [` ${s.value.padStart(ROW.value)}`, TONE.dim]
    ];
  }
  var STAGE = (() => {
    const h = CLAWD.stand.length + 1;
    const pileX = artWidth(CLAWD.stand) + 1;
    const fireX = pileX + artWidth(WOODPILE);
    const w = fireX + artWidth(FIREPLACE);
    return { w, h, clawdX: 0, clawdY: 0, pileX, pileY: h - 1 - WOODPILE.length, fireX, fireY: h - FIREPLACE.length };
  })();
  var GAP = 2;
  var COLUMNS = ROW_COLUMNS + GAP + STAGE.w;
  var ROWS = STAGE.h / 2;
  function frame(s, now) {
    const { w, h } = STAGE;
    const px = new Int32Array(w * h).fill(NONE);
    const put = (x, y, c) => {
      x = Math.round(x);
      y = Math.round(y);
      if (x >= 0 && y >= 0 && x < w && y < h)
        px[y * w + x] = c;
    };
    const sprite = (art, x, y, color = (ch) => PAL[ch]) => {
      art.forEach((line, j) => {
        for (let i = 0;i < line.length; i++) {
          const c = color(line[i]);
          if (c !== undefined)
            put(x + i, y + j, c);
        }
      });
    };
    const tick = Math.floor(now / FLAME_MS);
    const glyphs = [];
    for (let x = 0;x < STAGE.fireX; x++)
      put(x, h - 1, PAL.G);
    sprite(WOODPILE, STAGE.pileX, STAGE.pileY);
    drawFireplace(s, tick, sprite, put);
    drawClawd(s, now, sprite, glyphs);
    const cells = new Uint32Array(COLUMNS * ROWS * 3).fill(0);
    for (let i = 0;i < COLUMNS * ROWS; i++) {
      cells[i * 3] = 32;
      cells[i * 3 + 1] = DEFAULT;
      cells[i * 3 + 2] = DEFAULT;
    }
    let col = 0;
    for (const [text, fg] of row(s)) {
      for (const ch of text) {
        const at = ((ROWS - 1) * COLUMNS + col++) * 3;
        cells[at] = ch.codePointAt(0);
        cells[at + 1] = fg;
      }
    }
    for (let r = 0;r < ROWS; r++) {
      for (let x = 0;x < w; x++) {
        const at = (r * COLUMNS + ROW_COLUMNS + GAP + x) * 3;
        const top = px[r * 2 * w + x];
        const bottom = px[(r * 2 + 1) * w + x];
        if (top === NONE && bottom === NONE)
          continue;
        if (bottom === NONE) {
          cells[at] = 9600;
          cells[at + 1] = top;
        } else if (top === NONE) {
          cells[at] = 9604;
          cells[at + 1] = bottom;
        } else {
          cells[at] = 9600;
          cells[at + 1] = top;
          cells[at + 2] = bottom;
        }
      }
    }
    for (const g of glyphs) {
      if (g.x < 0 || g.x >= w || g.row < 0 || g.row >= ROWS)
        continue;
      const at = (g.row * COLUMNS + ROW_COLUMNS + GAP + g.x) * 3;
      const top = px[g.row * 2 * w + g.x];
      const bottom = px[(g.row * 2 + 1) * w + g.x];
      const behind = bottom !== NONE ? bottom : top;
      cells[at] = g.ch.codePointAt(0);
      cells[at + 1] = g.fg;
      cells[at + 2] = behind === NONE ? DEFAULT : behind;
    }
    return { cells, columns: COLUMNS, rows: ROWS };
  }
  var BED_Y = STAGE.fireY + BED.y;
  var LOGS_Y = STAGE.fireY + LOGS_ROW;
  var HEARTH_Y = STAGE.fireY + HEARTH_ROW;
  function drawFireplace(s, tick, sprite, put) {
    const fx = STAGE.fireX;
    const isLit = s.fire > 0;
    const glow = isLit ? 0.25 + 0.45 * s.fire : s.kind === "cold" ? 0.18 * (1 - s.cold) : 0;
    sprite(FIREPLACE, fx, STAGE.fireY, (ch) => {
      if (ch === "k")
        return mix(PAL.k, 9058850, glow);
      if (ch === "D")
        return mix(PAL.D, 4857360, glow * 0.6);
      return PAL[ch];
    });
    for (let x = BED.x - 1;x < BED.x + BED.w + 1; x++)
      put(fx + x, HEARTH_Y, mix(PAL.R, 16096779, glow * 0.45));
    const x0 = fx + BED.x;
    if (isLit) {
      const rows = s.fire >= 0.75 ? 3 : 2;
      for (let r = 0;r < rows; r++) {
        const y = BED_Y - r;
        const inset = r === 0 ? 0 : Math.min(3, r + 1);
        for (let i = inset;i < BED.w - inset; i++) {
          let ch;
          if (r === 0)
            ch = (i + tick) % 2 === 0 ? "F" : "f";
          else if (r === rows - 1)
            ch = TIPS[(tick + r * 5) % TIPS.length][i];
          else
            ch = hash(tick, r * 16 + i) < 0.7 ? (i + tick + r) % 2 === 0 ? "F" : "y" : ".";
          if (ch !== ".")
            put(x0 + i, y, PAL[ch]);
        }
      }
      if (s.fire > 0.9 || s.isStoked) {
        for (let k = 0;k < 3; k++) {
          const y = BED_Y - rows - Math.floor(hash(tick, 300 + k) * 2);
          if (y >= STAGE.fireY + 2 && hash(tick, 100 + k) < 0.6)
            put(x0 + 1 + Math.floor(hash(tick, 200 + k) * (BED.w - 2)), y, PAL.y);
        }
      }
      return;
    }
    if (s.kind === "cold") {
      for (let i = 0;i < BED.w; i++) {
        if (hash(i, 7) < 0.75 - 0.6 * s.cold)
          put(x0 + i, LOGS_Y, PAL[(i + tick) % 3 === 0 ? "F" : "f"]);
      }
      smoke(x0 + 3, 0.5, tick, sprite);
      return;
    }
    if (s.kind === "expired") {
      for (let i = 0;i < BED.w; i++)
        if (i % 5 !== 4)
          put(x0 + i, LOGS_Y, PAL.a);
      smoke(x0 + 2, 1, tick, sprite);
    }
  }
  function smoke(x, strength, tick, sprite) {
    const t = tick % 16;
    if (t >= 8)
      return;
    const y = LOGS_Y - 1 - Math.floor(t / 2);
    if (y < STAGE.fireY + 3)
      return;
    const puff = PUFFS[Math.min(PUFFS.length - 1, Math.floor(t / 3))];
    const color = mix(PAL.D, PAL.s, strength * (1 - t / 12));
    sprite(puff, x + (t >> 2), y - puff.length + 1, (ch) => ch === "s" ? color : undefined);
  }
  function drawClawd(s, now, sprite, glyphs) {
    const { clawdX: x, clawdY: y } = STAGE;
    if (s.throwMs !== null)
      return drawThrow(Math.floor(s.throwMs / 125) * 125, sprite);
    if (s.pokeMs !== null)
      return drawPoke(Math.floor(s.pokeMs / 125) * 125, sprite, glyphs);
    const isBlink = now % 4100 < 160;
    const isFront = now % 17000 > 15200;
    const isCold = s.kind === "cold" || s.kind === "expired";
    const isRubbing = now % 6000 < 2000;
    let art;
    if (isFront)
      art = CLAWD.front;
    else if (isCold)
      art = isRubbing && Math.floor(now / 250) % 2 === 1 ? CLAWD.rub : CLAWD.warm;
    else if (s.kind === "burning")
      art = CLAWD.warm;
    else
      art = CLAWD.stand;
    sprite(isBlink ? shut(art) : art, x, y);
    if (isCold)
      sprite(SCARF, x, y);
  }
  function walk(t, from, to, face, sprite) {
    const i = Math.min(3, Math.floor(t / 125));
    const x = from + Math.sign(to - from) * [0, 1, 1, 2][i];
    sprite(face(i % 2 === 0 ? CLAWD.step : CLAWD.stand), x, STAGE.clawdY);
  }
  var facing = (a) => a;
  function drawThrow(t, sprite) {
    const { clawdY: y, fireX } = STAGE;
    const x = 2;
    if (t < T_WALK)
      return walk(t, 0, x, facing, sprite);
    if (t < T_PICK)
      return sprite(CLAWD.crouch, x, y);
    if (t < T_LIFT) {
      sprite(CLAWD.stand, x, y);
      return sprite(LOG, x + 15, y + 3);
    }
    if (t < T_RELEASE) {
      sprite(CLAWD.toss, x, y);
      return sprite(LOG, x + 16, y);
    }
    if (t < T_IMPACT) {
      const k = (t - T_RELEASE) / (T_IMPACT - T_RELEASE);
      sprite(CLAWD.toss, x, y);
      return sprite(LOG, lerp(x + 16, fireX + BED.x + 2, k), lerp(y + 1, BED_Y - 1, k));
    }
    if (t < T_TURN)
      return sprite(shut(CLAWD.stand), x, y);
    if (t < T_BACK)
      return sprite(turned(CLAWD.stand), x, y);
    if (t < T_BACK + 500)
      return walk(t - T_BACK, x, 0, turned, sprite);
    if (t < T_BACK + 625)
      return sprite(turned(CLAWD.stand), 0, y);
    sprite(CLAWD.stand, 0, y);
  }
  function drawPoke(t, sprite, glyphs) {
    const { clawdY: y, fireX } = STAGE;
    const x = 1;
    if (t < P_REACH)
      return walk(t, 0, x, facing, sprite);
    if (t >= P_DONE) {
      const back = t - P_DONE < 125;
      return sprite(back ? CLAWD.step : CLAWD.stand, back ? x : 0, y);
    }
    sprite(CLAWD.poke, x, y);
    const isIn = P_JABS.some((j) => t >= j && t < j + P_JAB_MS);
    const tipX = fireX + BED.x + (isIn ? 1 : 0);
    const row = (y + 4) / 2;
    for (let gx = x + artWidth(CLAWD.poke);gx < tipX; gx++)
      glyphs.push({ x: gx, row, ch: "─", fg: PAL.L });
    glyphs.push({ x: tipX, row: row + 1, ch: "╲", fg: isIn ? PAL.F : PAL.L });
  }
  function line(s) {
    const cells = new Uint32Array(ROW_COLUMNS * 3);
    let c = 0;
    for (const [text, fg] of row(s)) {
      for (const ch of text) {
        cells[c * 3] = ch.codePointAt(0);
        cells[c * 3 + 1] = fg;
        cells[c * 3 + 2] = DEFAULT;
        c++;
      }
    }
    return { cells, columns: ROW_COLUMNS, rows: 1 };
  }

  // tools/tuner/main.ts
  var MIN2 = 60000;
  var FRAME_MS = 125;
  var DEFAULT2 = 16777216;
  var MARK_COLUMNS = 5;
  var T0 = 1790000000000;
  var THEMES = {
    dark: { bg: "#0c0c0c", fg: "#dcdcdc", dim: "#8a8580", rule: "#3a3836" },
    light: { bg: "#faf9f5", fg: "#282828", dim: "#8a8580", rule: "#cfcac0" }
  };
  var theme = localStorage.getItem("clawd-fireplace-theme") === "light" ? "light" : "dark";
  var css = (n) => "#" + (n & 16777215).toString(16).padStart(6, "0");
  var BRAILLE_DOTS = [[0, 0], [0, 1], [0, 2], [1, 0], [1, 1], [1, 2], [0, 3], [1, 3]];
  var dpr = () => window.devicePixelRatio || 1;
  var snap = (v) => Math.round(v * dpr()) / dpr();
  var rect = (ctx, x, y, w, h) => ctx.fillRect(snap(x), snap(y), snap(x + w) - snap(x), snap(y + h) - snap(y));
  function size(canvas, w, h) {
    const dpr = window.devicePixelRatio || 1;
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      canvas.style.width = `${w}px`;
      canvas.style.height = `${h}px`;
    }
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = THEMES[theme].bg;
    ctx.fillRect(0, 0, w, h);
    ctx.textBaseline = "middle";
    return ctx;
  }
  function cells(ctx, d, col0, row0, cw) {
    const ch = cw * 2;
    ctx.font = `${Math.round(ch * 0.72)}px "Cascadia Mono", Consolas, Menlo, "Segoe UI Symbol", monospace`;
    for (let r = 0;r < d.rows; r++) {
      for (let c = 0;c < d.columns; c++) {
        const at = (r * d.columns + c) * 3;
        const cp = d.cells[at], fg = d.cells[at + 1], bg = d.cells[at + 2];
        const x = (col0 + c) * cw, y = (row0 + r) * ch;
        if (!(bg & DEFAULT2)) {
          ctx.fillStyle = css(bg);
          rect(ctx, x, y, cw, ch);
        }
        ctx.fillStyle = fg & DEFAULT2 ? THEMES[theme].fg : css(fg);
        if (cp === 9600)
          rect(ctx, x, y, cw, ch / 2);
        else if (cp === 9604)
          rect(ctx, x, y + ch / 2, cw, ch / 2);
        else if (cp >= 9617 && cp <= 9619) {
          const dw = cw / 4, dh = ch / 8;
          for (let j = 0;j < 8; j++)
            for (let i = 0;i < 4; i++) {
              const on = cp === 9617 ? (i + 2 * j) % 4 === 0 : cp === 9618 ? (i + j) % 2 === 0 : (i + 2 * j) % 4 !== 0;
              if (on)
                rect(ctx, x + i * dw, y + j * dh, dw, dh);
            }
        } else if (cp === 9472)
          rect(ctx, x, y + ch / 2 - 1, cw, 2);
        else if (cp === 9586) {
          ctx.strokeStyle = ctx.fillStyle;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + cw, y + ch);
          ctx.stroke();
        } else if (cp >= 10240 && cp <= 10495) {
          const r = cw * 0.13;
          BRAILLE_DOTS.forEach(([i, j], bit) => {
            if (!(cp - 10240 & 1 << bit))
              return;
            ctx.beginPath();
            ctx.arc(x + cw * (0.3 + 0.4 * i), y + ch * (0.17 + 0.22 * j), r, 0, Math.PI * 2);
            ctx.fill();
          });
        } else if (cp !== 32 && cp !== 0)
          ctx.fillText(String.fromCodePoint(cp), x, y + ch / 2 + 1);
      }
    }
  }
  function band(inp, width) {
    const room = width - MARK_COLUMNS;
    if (room >= COLUMNS)
      return frame(derive(inp), inp.now);
    if (room >= ROW_COLUMNS)
      return line(derive(inp));
    return null;
  }
  var $ = (id) => document.getElementById(id);
  var live = $("live");
  var left = $("left");
  var leftOut = $("leftOut");
  var widthIn = $("width");
  var widthOut = $("widthOut");
  var speedIn = $("speed");
  var status = $("status");
  var now = T0;
  var lastRequestAt = now - 25 * MIN2;
  var pendingRequest = null;
  var throwAt = null;
  var pokeAt = null;
  var isPlaying = true;
  left.oninput = () => {
    lastRequestAt = now - (TTL_MS - Number(left.value) * MIN2);
    pendingRequest = null;
  };
  $("unlit").onclick = () => {
    lastRequestAt = null;
    pendingRequest = null;
  };
  var send = () => {
    if (isColdStart(now, lastRequestAt))
      throwAt = now;
    else
      pokeAt = now;
    pendingRequest = now + 200;
  };
  $("send").onclick = send;
  var togglePlay = () => {
    isPlaying = !isPlaying;
    $("play").textContent = isPlaying ? "pause" : "play";
  };
  $("play").onclick = togglePlay;
  var setTheme = (t) => {
    theme = t;
    document.body.dataset.theme = t;
    localStorage.setItem("clawd-fireplace-theme", t);
  };
  $("theme").onclick = () => setTheme(theme === "dark" ? "light" : "dark");
  setTheme(theme);
  document.addEventListener("keydown", (e) => {
    if (e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement)
      return;
    if (e.key === "p")
      send();
    else if (e.key === " ") {
      e.preventDefault();
      togglePlay();
    }
  });
  function drawLive() {
    const cw = 9, ch = cw * 2;
    const width = Number(widthIn.value);
    widthOut.value = `${width} cols`;
    const inp = { now, lastRequestAt, throwAt, pokeAt };
    const d = band(inp, width);
    const t = THEMES[theme];
    const bandRows = d?.rows ?? 0;
    const ctx = size(live, width * cw, (bandRows + 5) * ch);
    ctx.font = `${Math.round(ch * 0.72)}px "Cascadia Mono", Consolas, Menlo, monospace`;
    ctx.fillStyle = t.dim;
    ctx.fillText("⏺ the transcript ends here", 0, ch / 2);
    if (d) {
      cells(ctx, d, width - MARK_COLUMNS - d.columns, 1, cw);
      ctx.fillStyle = t.dim;
      ctx.fillText("[-]", (width - 4) * cw, (bandRows + 0.5) * ch);
    }
    const rule = (r) => {
      ctx.fillStyle = t.rule;
      ctx.fillRect(0, (r + 0.5) * ch, width * cw, 1);
    };
    rule(bandRows + 2);
    ctx.fillStyle = t.fg;
    ctx.fillText("❯", cw, (bandRows + 3.5) * ch);
    rule(bandRows + 4);
    const s = derive(inp);
    const m = lastRequestAt === null ? null : (TTL_MS - (now - lastRequestAt)) / MIN2;
    leftOut.value = m === null ? "unlit" : `${m.toFixed(1)}m`;
    if (m !== null && document.activeElement !== left)
      left.value = String(m);
    status.textContent = `${s.kind} · ${s.value}${d ? "" : " · too narrow, nothing drawn"}${d && d.rows === 1 ? " · the row alone" : ""}`;
  }
  var SHOTS = [
    { title: "unlit, first prompt: a log", lastAgo: null, act: "throw" },
    { title: "burning, 50m left", lastAgo: 10 * MIN2 },
    { title: "prompt at 40m left: a poke", lastAgo: 20 * MIN2, act: "poke" },
    { title: "burning, 25m left", lastAgo: 35 * MIN2 },
    { title: "cold, 15m left", lastAgo: 45 * MIN2 },
    { title: "cold, 4m left: flickers every 30 s", lastAgo: 56 * MIN2 },
    { title: "expired", lastAgo: 70 * MIN2 },
    { title: "expired, prompt: a log", lastAgo: 70 * MIN2, act: "throw" }
  ];
  var LOOP_MS = THROW_MS + 2000;
  var gallery = $("gallery");
  var shotCanvases = SHOTS.map((s) => {
    const card = document.createElement("div");
    card.className = "card";
    const label = document.createElement("span");
    label.textContent = s.title;
    const c = document.createElement("canvas");
    card.append(label, c);
    gallery.append(card);
    return c;
  });
  function drawGallery(clock) {
    const cw = 6;
    SHOTS.forEach((s, i) => {
      const t = clock % LOOP_MS;
      const at = T0 + (s.act ? t : clock);
      const last = s.act && t > 200 ? T0 + 200 : s.lastAgo === null ? null : at - (s.act ? t : 0) - s.lastAgo;
      const d = frame(derive({ now: at, lastRequestAt: last, throwAt: s.act === "throw" ? T0 : null, pokeAt: s.act === "poke" ? T0 : null }), at);
      cells(size(shotCanvases[i], d.columns * cw, d.rows * cw * 2), d, 0, 0, cw);
    });
  }
  var galleryClock = 0;
  setInterval(() => {
    if (isPlaying) {
      const isActing = [throwAt, pokeAt].some((at) => at !== null && now - at < THROW_MS + 500);
      now += FRAME_MS * (isActing ? 1 : Number(speedIn.value));
      galleryClock += FRAME_MS;
      if (pendingRequest !== null && now >= pendingRequest) {
        lastRequestAt = pendingRequest;
        pendingRequest = null;
      }
    }
    drawLive();
    drawGallery(galleryClock);
  }, FRAME_MS);
})();
</script>
